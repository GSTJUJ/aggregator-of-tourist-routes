<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Личный кабинет | Лина-НСК</title>

  <link rel="stylesheet" href="/static/css/profile.css"/>
  
  <!-- Шрифты -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body>

<header class="header">
  <div class="container nav">
    
    <div class="logo">
      <a href="/">
            <img src="/static/images/Логотип.png" alt="Лина НСК" class="logo-img">
        </a>
    </div>

    <nav class="menu">
      <a href="/excursions">ЭКСКУРСИИ</a>
      <a href="/schools">ДЛЯ ШКОЛ</a>
      <a href="/about">О НАС</a>
      <a href="/contacts">КОНТАКТЫ</a>
    </nav>

  </div>
</header>

<hr class="hero-dashed">

<main>
  <div class="profile-container">
    <!-- Левый сайдбар с аватаркой и навигацией -->
    <aside class="profile-sidebar">
      <div class="avatar-block">
        <div class="avatar-frame">
          <img src="/static/images/avatar-placeholder.svg" alt="Аватар пользователя" class="avatar-img" id="avatarImage">
          <button class="avatar-edit-btn" id="avatarEditButton" aria-label="Изменить аватар">✎</button>
          <input type="file" id="avatarInput" class="avatar-input" accept="image/*" hidden>
        </div>
        <h2 class="user-name" id="profileFullName">Профиль</h2>
        <p class="user-role">Любитель экскурсий</p>
      </div>
      <nav class="profile-nav">
        <a href="#" class="profile-nav-link active" id="mainProfileLink">📋 Основное</a>
        <a href="#" class="profile-nav-link" id="settingsProfileLink">⚙️ Настройки</a>
      </nav>
    </aside>

    <!-- Правая область контента профиля -->
    <div class="profile-content">
      <div class="profile-card">
        <div class="card-header">
          <h3>Личная информация</h3>
          <button class="edit-btn" id="logoutButton">Выйти</button>
        </div>
        <div class="info-grid">
          <div class="info-item">
            <span class="info-label">Имя</span>
            <span class="info-value" id="infoFullName">-</span>
          </div>
          <div class="info-item">
            <span class="info-label">Регион</span>
            <span class="info-value" id="infoRegion">-</span>
          </div>
          <div class="info-item">
            <span class="info-label">Email</span>
            <span class="info-value" id="infoEmail">-</span>
          </div>
          <div class="info-item">
            <span class="info-label">Телефон</span>
            <span class="info-value" id="infoPhone">-</span>
          </div>
          <div class="info-item full-width">
            <span class="info-label">ID пользователя</span>
            <span class="info-value" id="infoId">-</span>
          </div>
        </div>
      </div>

      <div class="profile-card settings-card" id="settingsCard" hidden>
        <div class="card-header">
          <h3>Настройки профиля</h3>
        </div>
        <form class="settings-form" id="profileSettingsForm">
          <label>
            <span>Имя</span>
            <input type="text" id="settingsFullName" required>
          </label>
          <label>
            <span>Email</span>
            <input type="email" id="settingsEmail" required>
          </label>
          <label>
            <span>Регион</span>
            <input type="text" id="settingsRegion" required>
          </label>
          <label>
            <span>Телефон</span>
            <input type="text" id="settingsPhone" required>
          </label>
          <button type="submit">Сохранить</button>
        </form>
      </div>

    </div>
  </div>
</main>

<div class="copyright">
  <p>© Лина-НСК Агентство экскурсий, 2025</p>
</div>

<script src="/static/js/profile.js"></script>
</body>
</html>
