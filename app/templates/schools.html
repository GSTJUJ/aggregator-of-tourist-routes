<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Для школ | Лина-НСК</title>

  <link rel="stylesheet" href="/static/css/excursions.css"/>
  <link rel="stylesheet" href="/static/css/schools.css"/>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body>

<header class="header">
  <div class="container nav">
    <div class="logo">
      <a href="/">
        <img src="/static/images/Логотип.png" alt="Лина НСК" class="logo-img">
      </a>
    </div>

    <nav class="menu">
      <a href="/excursions">ЭКСКУРСИИ</a>
      <a href="/schools">ДЛЯ ШКОЛ</a>
      <a href="/about">О НАС</a>
      <a href="/contacts">КОНТАКТЫ</a>
    </nav>

    <button class="header-btn" id="profileButton">Профиль</button>
  </div>
</header>

<hr class="hero-dashed">

<main class="excursions-page schools-page">
  <section class="container excursions-hero schools-hero">
    <h1>Для школ</h1>
    <p>Экскурсии и мастер-классы для классов, педагогов и школьных групп</p>

    <form class="search-panel" id="searchForm">
      <input type="search" id="queryInput" placeholder="Тема экскурсии">
      <input type="text" id="cityInput" placeholder="Город">
      <button type="submit">Найти</button>
    </form>
  </section>

  <section class="container school-tags">
    <span>Познавательные</span>
    <span>Профориентационные</span>
    <span>Мастер-классы</span>
  </section>

  <section class="container results-section">
    <div class="section-title">
      <h2>Экскурсии для школьников</h2>
      <span id="resultsCount">0</span>
    </div>

    <div class="tour-grid" id="tourGrid"></div>
    <p class="empty-state" id="emptyState">Экскурсии для школ пока не найдены</p>
  </section>
</main>

<div class="dev-toast" id="devToast">Пока в разработке</div>

<script>
  document.getElementById("profileButton").addEventListener("click", () => {
    window.location.href = localStorage.getItem("access_token")
      ? "/profile"
      : "/login-page";
  });

  const searchForm = document.getElementById("searchForm");
  const queryInput = document.getElementById("queryInput");
  const cityInput = document.getElementById("cityInput");
  const tourGrid = document.getElementById("tourGrid");
  const emptyState = document.getElementById("emptyState");
  const resultsCount = document.getElementById("resultsCount");
  const devToast = document.getElementById("devToast");
  let toastTimer;

  function showDevToast() {
    clearTimeout(toastTimer);
    devToast.classList.add("is-visible");

    toastTimer = setTimeout(() => {
      devToast.classList.remove("is-visible");
    }, 2200);
  }

  function formatPrice(tour) {
    if (!tour.price) {
      return "Цена уточняется";
    }

    return `${Number(tour.price).toLocaleString("ru-RU")} ${tour.currency || "RUB"}`;
  }

  function matchesExtraQuery(tour, query) {
    if (!query) {
      return true;
    }

    const text = [
      tour.title,
      tour.description,
      tour.city,
      tour.country
    ].join(" ").toLowerCase();

    return text.includes(query.toLowerCase());
  }

  function isSchoolTour(tour) {
    const text = [
      tour.title,
      tour.description,
      tour.city,
      tour.country
    ].join(" ").toLowerCase();

    const schoolWords = [
      "школь",
      "учен",
      "класс",
      "педагог",
      "профориентац",
      "наукоград",
      "музей",
      "мастер-класс"
    ];
    const adultWords = ["взросл"];

    return schoolWords.some((word) => text.includes(word))
      && !adultWords.some((word) => text.includes(word));
  }

  function createTourCard(tour) {
    const card = document.createElement("article");
    card.className = "tour-card";

    card.innerHTML = `
      <div class="tour-image">
        ${tour.image_url ? `<img src="${tour.image_url}" alt="">` : `<span>${tour.city || "Экскурсия"}</span>`}
      </div>
      <div class="tour-card-body">
        <div class="tour-meta">
          <span>${tour.city || "Город не указан"}</span>
          <span>${tour.rating ? `★ ${tour.rating}` : "Без рейтинга"}</span>
        </div>
        <h3>${tour.title}</h3>
        <p>${tour.description || "Описание скоро появится"}</p>
        <div class="tour-footer">
          <strong>${formatPrice(tour)}</strong>
          <button type="button" class="details-button">Подробнее</button>
        </div>
      </div>
    `;

    card.querySelector(".details-button").addEventListener("click", showDevToast);

    return card;
  }

  async function loadSchoolTours() {
    const params = new URLSearchParams();
    params.set("query", "");
    params.set("city", cityInput.value.trim());

    const response = await fetch(`/search?${params.toString()}`);
    const tours = await response.json();
    const filteredTours = tours.filter((tour) => {
      return isSchoolTour(tour)
        && matchesExtraQuery(tour, queryInput.value.trim());
    });

    tourGrid.innerHTML = "";
    resultsCount.textContent = filteredTours.length;
    emptyState.hidden = filteredTours.length > 0;

    filteredTours.forEach((tour) => {
      tourGrid.appendChild(createTourCard(tour));
    });
  }

  searchForm.addEventListener("submit", (event) => {
    event.preventDefault();
    loadSchoolTours();
  });

  loadSchoolTours();
</script>
</body>
</html>
